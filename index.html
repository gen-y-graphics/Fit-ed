<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<title>Fit’ed</title>
<style>
/* ============================================================
   THEME TOKENS — all five themes are dark-ground, warm-biased
   ============================================================ */
html[data-theme="midnight"]{
  --bg:#0B0C0E; --panel:#141619; --panel2:#1B1E22; --line:#2A2E34;
  --gold:#F2C230; --golddim:#8A7024; --fit:#3BE0C8; --fitdim:#1E6E62;
  --text:#E9EBEE; --muted:#8D949E;
  --p:#5BA9F5; --c:#F2C230; --f:#F2795B; --ok:#3BE0C8;
  --shadow:rgba(0,0,0,.55);
}
html[data-theme="beige"]{
  --bg:#16110D; --panel:#1E1813; --panel2:#271F18; --line:#382C22;
  --gold:#E8B573; --golddim:#7E603A; --fit:#EBD3B0; --fitdim:#6E5F4A;
  --text:#F4EAE0; --muted:#A79581;
  --p:#86B79F; --c:#E8B573; --f:#E28F6E; --ok:#86B79F;
  --shadow:rgba(0,0,0,.5);
}
html[data-theme="sand"]{
  --bg:#14150F; --panel:#1C1D15; --panel2:#24261C; --line:#343627;
  --gold:#D6C67E; --golddim:#726A41; --fit:#B9C99A; --fitdim:#5C6A4B;
  --text:#EDEEE0; --muted:#9AA085;
  --p:#9FC9A8; --c:#D6C67E; --f:#DDA073; --ok:#9FC9A8;
  --shadow:rgba(0,0,0,.5);
}
html[data-theme="blush"]{
  --bg:#150F12; --panel:#1E161A; --panel2:#261C21; --line:#372833;
  --gold:#EFC08A; --golddim:#7C6444; --fit:#E0A3BF; --fitdim:#6E4B5C;
  --text:#F3E6EA; --muted:#A98F9B;
  --p:#B6A6E4; --c:#EFC08A; --f:#E58585; --ok:#A8CDA6;
  --shadow:rgba(0,0,0,.5);
}
html[data-theme="stone"]{
  --bg:#131211; --panel:#1C1B19; --panel2:#242220; --line:#33302C;
  --gold:#D8B98C; --golddim:#6F5F47; --fit:#B8B2A6; --fitdim:#5A564E;
  --text:#EDEAE4; --muted:#97928A;
  --p:#93B3B8; --c:#D8B98C; --f:#D4907A; --ok:#9DBE9B;
  --shadow:rgba(0,0,0,.5);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  transition:background-color .28s ease, color .28s ease;
}
button,select,input{font:inherit;color:inherit}
a{color:var(--fit)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.hidden{display:none !important}

/* ============================================================
   HEADER
   ============================================================ */
header{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  transition:background-color .28s ease,border-color .28s ease;
}
.hdr-in{
  max-width:780px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1}
.brand .b1{color:var(--fit)}
.brand .b2{color:var(--gold)}
.brand-sub{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.wk-wrap{display:flex;align-items:center;gap:7px}
.selshell{position:relative;display:inline-flex;align-items:center}
.selshell::after{
  content:"";position:absolute;right:11px;pointer-events:none;
  width:6px;height:6px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);
  transform:translateY(-2px) rotate(45deg);
}
select.wk{
  appearance:none;-webkit-appearance:none;
  background:var(--panel);border:1px solid var(--golddim);color:var(--gold);
  font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:8px 28px 8px 12px;border-radius:999px;cursor:pointer;
  max-width:190px;text-overflow:ellipsis;
}
select.wk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.live{
  background:var(--gold);color:var(--bg);border:none;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 11px;cursor:pointer;
}
.subbar{
  max-width:780px;margin:0 auto;padding:0 16px 10px;
  font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.subbar b{color:var(--text);font-weight:700}
.dot{opacity:.45}

/* ============================================================
   VIEWS + TRANSITIONS
   ============================================================ */
main{padding-bottom:96px;min-height:60vh}
.view{opacity:1}
.view.in{animation:viewIn .24s cubic-bezier(.22,.7,.3,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================
   TYPE / SHARED
   ============================================================ */
h1.title{font-size:26px;font-weight:800;letter-spacing:-.015em;margin:16px 0 2px}
h1.title.sm{font-size:22px}
.subtitle{color:var(--muted);font-size:14px;margin:0 0 2px}
h2.sec{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:26px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 17px;margin-bottom:11px;transition:border-color .18s,background-color .28s}
.card.tight{padding:13px 15px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:750;letter-spacing:-.01em}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card p.body{color:var(--text)}
.crumb{display:flex;align-items:center;gap:8px;padding:14px 0 0}
.back{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font-size:13px;font-weight:650;cursor:pointer;transition:border-color .16s;
}
.back:hover{border-color:var(--golddim)}
.back:focus-visible,.tap-card:focus-visible,.tabbtn:focus-visible,.chk:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
.footnote{font-size:12px;color:var(--muted);margin:22px 0 0;border-top:1px solid var(--line);padding-top:13px}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:6px}
.pill.train{background:color-mix(in srgb,var(--fit) 14%,transparent);color:var(--fit);border:1px solid var(--fitdim)}
.pill.rec{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);border:1px solid var(--line)}
.pill.gold{background:color-mix(in srgb,var(--gold) 13%,transparent);color:var(--gold);border:1px solid var(--golddim)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:650;color:var(--muted)}
.chip.on{color:var(--gold);border-color:var(--golddim)}

/* macro band */
.targets{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin-top:12px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.tgrid .lab{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tgrid .val{font-size:17px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.tgrid .p .val{color:var(--p)} .tgrid .c .val{color:var(--c)} .tgrid .f .val{color:var(--f)}
.tnote{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tnote b{color:var(--gold)}

/* tappable cards */
.tap-card{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin-bottom:10px;
  cursor:pointer;color:inherit;font:inherit;
  transition:border-color .16s,transform .16s,background-color .28s;
}
.tap-card:hover{border-color:var(--golddim);transform:translateY(-2px)}
.tap-card .arrow{font-size:11.5px;color:var(--muted);margin-top:8px}
.mrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mslot{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.mtime{font-size:11px;color:var(--muted);font-weight:650;white-space:nowrap}
.mname{font-size:16.5px;font-weight:750;margin-top:4px}
.mport{font-size:13px;color:var(--muted);margin-top:5px}

/* calendar grid */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.daycard{position:relative;overflow:hidden}
.daycard.today{border-color:var(--gold)}
.daycard.today::before{
  content:"Today";position:absolute;top:0;right:0;background:var(--gold);color:var(--bg);
  font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-bottom-left-radius:10px;
}
.dnum{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
.dname{font-size:18px;font-weight:750;margin-top:5px}
.ddate{font-size:12px;color:var(--muted);margin-top:1px}
.dsplit{font-size:12.5px;color:var(--muted);margin-top:8px}
.dkcal{font-size:13px;margin-top:7px;font-weight:700}
.dkcal span{color:var(--muted);font-weight:400}

/* checklists */
.chk{
  display:flex;width:100%;text-align:left;gap:12px;align-items:flex-start;
  background:none;border:none;padding:11px 0;cursor:pointer;
  border-bottom:1px solid var(--line);
}
.chk:last-child{border-bottom:none}
.box{
  flex:0 0 auto;width:22px;height:22px;border-radius:7px;margin-top:1px;
  border:1.5px solid var(--line);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  transition:background-color .18s,border-color .18s,transform .12s;
}
.box svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:opacity .16s,transform .16s}
.chk.done .box{background:var(--ok);border-color:var(--ok)}
.chk.done .box svg{opacity:1;transform:none}
.chk.done .ctext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--golddim)}
.ctext{font-size:14.5px;line-height:1.4}
.ctext .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;text-decoration:none}
.chk.done .ctext .sub{color:var(--muted)}

/* exercise rows */
.ex{padding:13px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exname{font-size:15.5px;font-weight:700}
.exdose{font-size:13px;color:var(--gold);font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.exmeta{font-size:12.5px;color:var(--muted);margin-top:4px}
.exnote{font-size:12.5px;color:var(--muted);margin-top:5px;font-style:italic}
.demo{
  display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--fit);text-decoration:none;
  border:1px solid var(--fitdim);border-radius:999px;padding:5px 11px;
}
.demo:hover{color:var(--gold);border-color:var(--golddim)}
.demo.play::before{content:"\25B6";font-size:9px;margin-right:5px;vertical-align:1px}
button.demo{background:none;cursor:pointer;font-family:inherit}
.vwrap{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:16px}
.vwrap.on{display:flex}
.vbox{width:100%;max-width:760px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.vtitle{font-size:15px;font-weight:700;color:var(--ink);line-height:1.25}
.vclose{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;
  width:32px;height:32px;font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto}
.vframe{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vfoot{margin-top:10px;text-align:center}
.vfoot a{font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
/* today row + inline play */
.ckrow{display:flex;align-items:stretch;gap:6px}
.ckrow .chk{flex:1;min-width:0}
.vplay{flex:0 0 auto;width:38px;background:none;border:1px solid var(--line);border-radius:12px;
  color:var(--fit);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vplay:active{border-color:var(--golddim);color:var(--gold)}

/* logging */
.logwrap{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.logtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.loglab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.loghist{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fit);background:none;border:1px solid var(--fitdim);border-radius:999px;
  padding:4px 9px;cursor:pointer}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 30px;gap:6px;align-items:center;margin-bottom:5px}
.setn{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.setrow input{width:100%;padding:8px 6px;font-size:15px;font-family:inherit;text-align:center;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;outline:none;
  -moz-appearance:textfield}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setrow input:focus{border-color:var(--gold)}
.setrow input.filled{border-color:var(--fitdim)}
.setdel{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:0;line-height:1}
.sethead{display:grid;grid-template-columns:26px 1fr 1fr 30px;gap:6px;margin-bottom:4px}
.sethead span{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center}
.prevline{font-size:11.5px;color:var(--muted);margin:6px 0 8px;font-variant-numeric:tabular-nums}
.prevline b{color:var(--fit);font-weight:600}
.logbtns{display:flex;gap:6px;margin-top:8px}
.logbtns button{flex:1;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.logbtns button.rest{border-color:var(--fitdim);color:var(--fit)}
.saved{font-size:10.5px;color:var(--fit);letter-spacing:.05em;text-transform:uppercase;font-weight:700}

/* rest timer bar */
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:8500;display:none;
  background:var(--panel);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px rgba(0,0,0,.4)}
.tbar.on{display:block}
.tbin{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.tclock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold);
  letter-spacing:-.02em;min-width:88px}
.tclock.done{color:var(--fit)}
.tmeta{flex:1;min-width:0}
.tname{font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.tbtns{display:flex;gap:6px;flex:0 0 auto}
.tbtns button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:8px 11px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.tprog{height:3px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden;max-width:720px;
  margin-left:auto;margin-right:auto}
.tprog i{display:block;height:100%;background:var(--gold);width:100%}

/* history modal */
.hbox{width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column}
.hscroll{overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:14px}
.hsess{border-bottom:1px solid var(--line);padding:10px 0}
.hsess:last-child{border-bottom:none}
.hdate{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hsets{font-size:13.5px;color:var(--ink);margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.6}
.hvol{font-size:11px;color:var(--muted);margin-top:3px}
.hempty{font-size:13px;color:var(--muted);text-align:center;padding:18px 0}
/* backup */
.bkstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.bkstat div{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:center}
.bkstat .n{font-size:19px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.2}
.bkstat .l{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.bkrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bkrow .btn{flex:1;min-width:130px}
.bkta{width:100%;min-height:90px;margin-top:10px;padding:10px;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:11px;
  outline:none;resize:vertical;-webkit-user-select:text;user-select:text}
.bkta:focus{border-color:var(--gold)}
.bkmsg{font-size:12px;margin-top:9px;min-height:17px;line-height:1.45}
.bkmsg.ok{color:var(--fit)} .bkmsg.err{color:#E0705F} .bkmsg.warn{color:var(--gold)}
.bkfile{display:none}
.bkwarn{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px;
  border-left:2px solid var(--line);padding-left:10px}

/* segmented control */
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin:14px 0 4px}
.seg button{
  flex:1;background:none;border:none;border-radius:999px;padding:8px 6px;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--muted);transition:background-color .18s,color .18s;
}
.seg button.on{background:var(--gold);color:var(--bg)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
td.num{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ingredients + steps */
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:flex-start}
ul.ing li:last-child{border-bottom:none}
ul.ing li .amt{color:var(--gold);font-weight:750;min-width:104px;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 15px 38px;font-size:14.5px}
ol.steps li:last-child{padding-bottom:0}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--golddim);color:var(--gold);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.note{font-size:14px;color:var(--muted)} .note strong{color:var(--text)}
.src{font-size:13px} .src ul{margin:0;padding-left:17px} .src li{margin-bottom:7px}
.src a{color:var(--fit);text-decoration:none;border-bottom:1px solid var(--fitdim)}
.src a:hover{color:var(--gold);border-color:var(--golddim)}

/* callouts */
.rule{border:1px solid var(--golddim);background:color-mix(in srgb,var(--gold) 7%,transparent);border-radius:14px;padding:13px 15px;margin-bottom:11px}
.rule .eyebrow{margin-bottom:4px;display:block}
.rule p{font-size:13.5px;color:var(--text);margin:0}
.totals{border:1px dashed var(--golddim);border-radius:14px;padding:12px 15px;margin-top:4px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.totals .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.totals .nums{font-size:13px;font-weight:650}

/* theme picker */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tbtn{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;
  cursor:pointer;text-align:left;transition:border-color .16s,transform .16s;
}
.tbtn:hover{transform:translateY(-2px)}
.tbtn.on{border-color:var(--gold)}
.tname{font-size:14px;font-weight:750}
.tdesc{font-size:11.5px;color:var(--muted);margin-top:2px}
.sw{display:flex;gap:5px;margin-top:10px}
.sw i{width:20px;height:20px;border-radius:6px;display:block;border:1px solid rgba(255,255,255,.08)}

/* inputs */
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
input[type=date],input[type=number]{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14px;min-width:150px;
}
input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 15px;
  font-size:13.5px;font-weight:700;cursor:pointer;transition:border-color .16s;
}
.btn:hover{border-color:var(--golddim)}
.btn.gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn.quiet{color:var(--muted)}

/* prep progress + task blocks */
.pwrap{border:1px solid var(--golddim);background:color-mix(in srgb,var(--gold) 6%,transparent);border-radius:14px;padding:13px 15px;margin-top:12px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.pnum{font-size:14px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.pnum span{color:var(--muted);font-weight:650;font-size:12px}
.pbar{height:7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s ease}
.bhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid var(--line)}
.bclock{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:800}
.bname{font-size:15.5px;font-weight:750;margin-top:4px;line-height:1.3}
.bmeta{font-size:11px;color:var(--muted);font-weight:650;white-space:nowrap;text-align:right}
.bcount{font-size:11.5px;color:var(--gold);font-weight:800;margin-top:4px;text-align:right;font-variant-numeric:tabular-nums}
.card.pdone{border-color:var(--fitdim)}
.card.pdone .bclock,.card.pdone .bcount{color:var(--ok)}
.tag{display:inline-block;margin-left:7px;font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:5px;white-space:nowrap}
.tag.hot{color:var(--f);border:1px solid var(--f)}
.tag.cold{color:var(--p);border:1px solid var(--p)}
.tag.hands{color:var(--muted);border:1px solid var(--line)}
.yield{display:block;font-size:11.5px;color:var(--gold);font-weight:700;margin-top:5px;text-decoration:none}
.chk.done .yield{color:var(--muted)}
.qty{color:var(--gold);font-weight:750;font-variant-numeric:tabular-nums}
.chk.done .qty{color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:13px}
.pgrid .lab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;line-height:1.3}
.pgrid .val{font-size:14.5px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.pgrid .p .val{color:var(--p)} .pgrid .c .val{color:var(--c)} .pgrid .f .val{color:var(--f)}
.card .tnote{margin-top:12px}
.seg.sub{margin:10px 0 14px}
.seg.sub button{font-size:12px}

/* sparkline */
.spark{width:100%;height:72px;display:block;margin-top:12px}

/* ============================================================
   BOTTOM TABS
   ============================================================ */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  transition:background-color .28s ease,border-color .28s ease;
}
.tabs-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbtn{
  background:none;border:none;cursor:pointer;padding:9px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);
  transition:color .18s;
}
.tabbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tablab{font-size:10px;font-weight:750;letter-spacing:.05em}
.tabbtn.on{color:var(--gold)}
.tabbtn.on .tablab{color:var(--gold)}

@media (max-width:430px){
  .cal{grid-template-columns:1fr 1fr}
  .dname{font-size:16px}
  select.wk{max-width:148px;font-size:10.5px}
  .brand{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

/* Meal 5 protein rotation: [name, raw oz per portion, short label] */
const M5ROT = {
  1:["Sirloin",8,"sirloin"], 2:["Turkey breast or 93/7 ground beef",8,"turkey"],
  3:["Sirloin",8,"sirloin"], 4:["Salmon",7.5,"salmon"], 5:["Sirloin",8,"sirloin"],
  6:["Sirloin",8,"sirloin"], 0:["Salmon",7.5,"salmon"]
};
const PREP_ELAPSED = "About 1 hr 45 min elapsed, roughly 70 min hands-on";

const FR = {"⅛":.125,"¼":.25,"⅓":1/3,"⅜":.375,"½":.5,"⅝":.625,"⅔":2/3,"¾":.75,"⅞":.875};
function qty(s){
  const m = String(s==null?"":s).match(/^\s*(\d+)?\s*([⅛¼⅓⅜½⅝⅔¾⅞])?/);
  let n=0; if(m){ if(m[1]) n+=Number(m[1]); if(m[2]) n+=FR[m[2]]; }
  return n;
}
function frac(n,den){
  den = den||4;
  /* thirds get their own glyphs so a sum of ⅓ cup days reads back as ⅓ */
  const wf=Math.floor(n+1e-9), ff=n-wf, t=Math.round(ff*3);
  if(t>0 && t<3 && Math.abs(ff-t/3)<.02) return `${wf||""}${t===1?"⅓":"⅔"}`;
  const r=Math.round(n*den)/den, w=Math.floor(r+1e-9), f=Math.round((r-w)*den);
  const M={2:{1:"½"},4:{1:"¼",2:"½",3:"¾"},8:{1:"⅛",2:"¼",3:"⅜",4:"½",5:"⅝",6:"¾",7:"⅞"}};
  const fs = f ? ((M[den]&&M[den][f])||"") : "";
  if(!w && !fs) return "0";
  return `${w||""}${fs}`;
}
function ceilTo(n,s){ return Math.ceil(n/s - 1e-9)*s; }
function ozLb(oz){ return `${frac(ceilTo(oz/16,.25))} lb`; }
function countIn(P,re){
  let n=0;
  Object.keys(P).forEach(k=>P[k].forEach(x=>{ if(re.test(x[1])) n += (qty(x[0])||1); }));
  return n;
}
const Q = v => `<span class="qty">${v}</span>`;
function cupStr(n,den){ return `${frac(n,den)} cup${n>1?"s":""}`; }

function prepData(w){
  const ws=weekStart(w), b=blockFor(w), ph=b.phase;
  const D={week:w, ws, b, ph, days:[], oats:0, rice:0, pot:0, veg:0, vegAM:0, vegPM:0,
           fu:0, banPre:0, banPost:0, cake:0, milk:0, honey:0, m5:{}, noRice:[], cakeDays:[]};
  for(let i=0;i<7;i++){
    const d=addDays(ws,i), dow=d.getDay();
    const tg=targetsFor(w,dow), P=portionsFor(w,dow), col=tg.base, m5=M5ROT[dow];
    const o=qty(ph.oats[col]), rTxt=ph.rice[col], r=(rTxt==="No rice"?0:qty(rTxt));
    const p=qty(ph.pot[col]), v2=qty(ph.veg2[col]), v5=qty(ph.veg5[col]);
    const carbs=P.m3.filter(x=>!/bar/i.test(x[1]));
    D.days.push({d,dow,tg,P,col,oats:o,rice:r,riceTxt:rTxt,pot:p,potTxt:ph.pot[col],
      veg:v2+v5, v2, v5, fu:tg.fu, m5:m5[0],
      pre: carbs.length ? carbs.map(x=>`${x[0]==="—"?"":x[0]+" "}${x[1].split(" — ")[0]}`).join(" · ") : "—"});
    D.oats+=o; D.rice+=r; D.pot+=p; D.veg+=v2+v5; D.fu+=tg.fu;
    if(i<4) D.vegAM+=v2+v5; else D.vegPM+=v2+v5;
    if(!r) D.noRice.push(DOW[dow]);
    const ck=countIn({x:P.m3},/rice cake/i); if(ck){ D.cake+=ck; D.cakeDays.push(DOW[dow]); }
    D.banPre += countIn({x:P.m3},/banana/i);
    D.banPost += countIn({x:P.m4},/banana/i);
    D.milk += countIn(P,/Fairlife/i);
    D.honey += countIn(P,/honey/i);
    if(!D.m5[m5[0]]) D.m5[m5[0]]={raw:m5[1], days:[]};
    D.m5[m5[0]].days.push(DOW[dow].slice(0,3));
  }
  D.ban = D.banPre + D.banPost;
  D.riceDry = ceilTo(D.rice/3, .25);
  D.chickenRaw = 7*6.5;
  D.whey = 7*1 + 7*1.5;
  D.prepSunday = addDays(ws,-1);
  return D;
}

var T = {id:null, left:0, total:0, name:"", running:false};
function tPaint(){
  const bar=$("tbar"); if(!bar) return;
  bar.classList.toggle("on", T.total>0);
  if(T.total<=0) return;
  const c=$("tclock");
  c.textContent = T.left>0?fmtClock(T.left):"Go";
  c.classList.toggle("done", T.left<=0);
  $("tname").textContent = T.name;
  $("tsub").textContent = T.left>0?(T.running?"Resting":"Paused"):"Rest complete";
  $("tpause").textContent = T.running?"Pause":"Resume";
  $("tfill").style.width = T.total?Math.max(0,(T.left/T.total*100))+"%":"0%";
}
function tStart(name, sec){
  tStop();
  T.name=name; T.total=sec; T.left=sec; T.running=true;
  T.id=setInterval(()=>{
    T.left--;
    if(T.left<=0){ T.left=0; T.running=false; clearInterval(T.id); T.id=null; tDing(); }
    tPaint();
  },1000);
  tPaint();
}
function tStop(){ if(T.id){clearInterval(T.id);T.id=null;} T.running=false; }
function tClear(){ tStop(); T.total=0; T.left=0; T.name=""; tPaint(); }
function tToggle(){
  if(T.left<=0){ tStart(T.name,T.total); return; }
  if(T.running){ tStop(); }
  else { T.running=true; T.id=setInterval(()=>{ T.left--;
    if(T.left<=0){T.left=0;T.running=false;clearInterval(T.id);T.id=null;tDing();}
    tPaint(); },1000); }
  tPaint();
}
function tAdd(s){
  if(T.total<=0) return;
  T.left+=s; T.total+=s;
  if(!T.running && T.left>0) tToggle();
  tPaint();
}
function tDing(){
  try{
    const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
    const c=new A();
    [0,0.18,0.36].forEach(off=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=880;
      o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.0001,c.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.25,c.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+off+0.15);
      o.start(c.currentTime+off); o.stop(c.currentTime+off+0.17);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
}

const BK_KEYS = ["fited.theme","fited.start","fited.grocery","fited.weights","fited.prep","fited.log","fited.rest","fited.lastbackup"];
function collectBackup(){
  const data={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.indexOf("fited.")===0 && k.indexOf("fited.chk.")!==0 && k!=="fited.lastdate")
        data[k]=localStorage.getItem(k);
    }
  }catch(e){}
  return {app:"Fited", v:1, exported:new Date().toISOString(), data:data};
}
function backupStats(obj){
  let sessions=0, movements=0, days=new Set(), weights=0, first=null, last=null;
  try{
    const raw=obj.data["fited.log"];
    if(raw){
      const L=JSON.parse(raw);
      movements=Object.keys(L).length;
      for(const ex of Object.keys(L)) for(const dt of Object.keys(L[ex])){
        days.add(dt); sessions++;
        if(!first||dt<first) first=dt;
        if(!last||dt>last) last=dt;
      }
    }
    const wr=obj.data["fited.weights"];
    if(wr) weights=Object.keys(JSON.parse(wr)).length;
  }catch(e){}
  return {movements:movements, entries:sessions, days:days.size, weights:weights, first:first, last:last};
}
function backupFileName(){
  const d=new Date();
  return "fited-backup-"+isoOf(d)+".json";
}
function doExport(mode){
  const obj=collectBackup();
  const txt=JSON.stringify(obj);
  if(mode==="file"){
    try{
      const b=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"});
      const u=URL.createObjectURL(b), a=document.createElement("a");
      a.href=u; a.download=backupFileName();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(u),1500);
      set("fited.lastbackup", isoOf(new Date()));
      bkMsg("ok","Backup file saved. Keep it somewhere you can find later.");
    }catch(e){ bkMsg("err","This browser blocked the download. Use Copy instead."); }
    return;
  }
  const ta=$("bkOut"); if(ta){ ta.value=txt; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{
      set("fited.lastbackup", isoOf(new Date()));
      bkMsg("ok","Copied. Paste it into Notes, an email to yourself, anywhere safe.");
    }).catch(()=>{
      if(ta){ ta.focus(); ta.select(); }
      bkMsg("warn","Select the text below and copy it manually.");
    });
  } else {
    if(ta){ ta.focus(); ta.select(); }
    bkMsg("warn","Select the text below and copy it manually.");
  }
}
function bkMsg(kind,msg){
  const el=$("bkMsg"); if(!el) return;
  el.className="bkmsg "+kind; el.textContent=msg;
}
function parseBackup(txt){
  const o=JSON.parse(txt);
  if(!o || typeof o!=="object") throw new Error("not an object");
  if(!o.data || typeof o.data!=="object") throw new Error("no data block");
  const keys=Object.keys(o.data).filter(k=>k.indexOf("fited.")===0);
  if(!keys.length) throw new Error("no Fit'ed keys inside");
  return o;
}
var PENDING=null;
function previewImport(){

  catch(e){ PENDING=null; paint(false); bkMsg("err","That doesn't read as a Fit'ed backup ("+e.message+")."); return; }

function applyImport(){
  if(!PENDING){ bkMsg("err","Nothing to restore. Check the backup first."); return; }
  const d=PENDING.data;
  try{
    Object.keys(d).forEach(k=>{
      if(k.indexOf("fited.")!==0) return;
      if(k.indexOf("fited.chk.")===0) return;
      localStorage.setItem(k, d[k]);
    });
  }catch(e){ bkMsg("err","Could not write to storage: "+e.message); return; }
  PENDING=null;
  const th=get(LS.theme,"midnight"); applyTheme(th);
  state.week=liveWeek(); buildWeekSelect();
  paint();
  bkMsg("ok","Restored. Your log, weigh-ins, start date and theme are back.");
}

  const days=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-d)/86400000);
  if(days<=0) return "Last backup: today.";
  if(days===1) return "Last backup: yesterday.";

}

function prepBlock(bl,done){
  const n=bl.tasks.length, d=bl.tasks.filter((t,i)=>done[`${bl.id}-${i}`]).length;
  if(state.prepHide && d===n) return "";
  let h=`<div class="card${d===n?" pdone":""}">
    <div class="bhead">
      <div><div class="bclock">${esc(bl.clock)}</div><div class="bname">${esc(bl.name)}</div></div>
      <div><div class="bmeta">${esc(bl.meta)}</div><div class="bcount">${d} / ${n}</div></div>
    </div>`;
  bl.tasks.forEach((t,i)=>{
    const key=`${bl.id}-${i}`, on=!!done[key];
    if(state.prepHide && on) return;
    h += `<button class="chk${on?" done":""}" data-pk="${key}">
      <span class="box">${TICK}</span>
      <span class="ctext">${t.t}${t.tag?`<span class="tag ${t.tag}">${t.tag==="hot"?"Heat":t.tag==="cold"?"Cold":"Hands-on"}</span>`:""}
      ${t.s?`<span class="sub">${t.s}</span>`:""}${t.y?`<span class="yield">${t.y}</span>`:""}</span></button>`;
  });
  return h+`</div>`;
}

/* ---------- prep checkmarks: keyed to the week, pruned after 21 days ---------- */
function prepKey(w){ return isoOf(weekStart(w)); }
function prepChecks(w){ return (getJSON(LS.prep,{})[prepKey(w)])||{}; }
function togglePrepCheck(w,id){
  const s=getJSON(LS.prep,{}), k=prepKey(w);
  s[k]=s[k]||{}; s[k][id]=!s[k][id];
  const cut=addDays(new Date(),-21);
  Object.keys(s).forEach(key=>{ if(parseISO(key)<cut) delete s[key]; });
  setJSON(LS.prep,s);
}
function resetPrepChecks(w){
  const s=getJSON(LS.prep,{}); delete s[prepKey(w)]; setJSON(LS.prep,s);
}

function renderProgress(){
  const weights=getJSON(LS.weights,{});
  const keys=Object.keys(weights).sort();
  const last=keys.slice(-7).map(k=>weights[k]);
  const avg = last.length ? (last.reduce((a,b)=>a+b,0)/last.length) : null;
  const prev = keys.slice(-14,-7).map(k=>weights[k]);
  const prevAvg = prev.length ? (prev.reduce((a,b)=>a+b,0)/prev.length) : null;
  const rate = (avg!==null && prevAvg!==null) ? (prevAvg-avg) : null;
  const todayIso = isoOf(new Date());

  let h=`<h1 class="title">Progress</h1>
    <p class="subtitle">The 7-day rolling average is the only weight number worth acting on.</p>
    <h2 class="sec">Log today's weight</h2>
    <div class="card">
      <div class="field">
        <input type="number" step="0.1" inputmode="decimal" id="wIn" placeholder="lb" value="${weights[todayIso]!==undefined?weights[todayIso]:""}">
        <button class="btn gold" data-act="saveWeight">Save for today</button>
      </div>
      <p style="margin-top:10px">Same time, post-void, pre-food, same clothing.</p>
    </div>
    <div class="targets"><div class="tgrid">
      <div><div class="lab">Latest</div><div class="val">${keys.length?weights[keys[keys.length-1]].toFixed(1):"—"}</div></div>
      <div class="p"><div class="lab">7-day avg</div><div class="val">${avg!==null?avg.toFixed(1):"—"}</div></div>
      <div class="c"><div class="lab">Weekly rate</div><div class="val">${rate!==null?(rate>=0?"−":"+")+Math.abs(rate).toFixed(2):"—"}</div></div>
      <div class="f"><div class="lab">Entries</div><div class="val">${keys.length}</div></div>
    </div>
    <div class="tnote"><span>Target rate: <b>1.5 to 1.6 lb per week</b></span><span>${keys.length<8?"Needs 8+ entries for a rate":"Act on the average, not a single day"}</span></div></div>`;

  if(keys.length>1){
    const vals=keys.slice(-30).map(k=>weights[k]);
    const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
    const pts=vals.map((v,i)=>`${(i/(vals.length-1))*100},${72-((v-mn)/rng)*60-6}`).join(" ");
    h += `<div class="card"><svg class="spark" viewBox="0 0 100 72" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg><p style="margin-top:6px">Last ${vals.length} entries · ${mn.toFixed(1)} to ${mx.toFixed(1)} lb</p></div>`;
  }

  h += `<h2 class="sec">Scan checkpoints</h2><div class="card"><div class="tscroll"><table>
    <tr><th>Checkpoint</th><th>Weight</th><th>Body fat</th><th>Watch</th></tr>`;
  CHECKPOINTS.forEach(([w,label,wt,bf,watch])=>{
    const hit = liveWeek()>=w;
    h += `<tr><td>${esc(label)}${hit?' <span class="pill gold" style="margin-left:4px">Due</span>':""}</td><td class="num">${esc(wt)}</td><td class="num">${esc(bf)}</td><td>${esc(watch)}</td></tr>`;
  });
  h += `</table></div></div>

  <h2 class="sec">What to measure, and how often</h2><div class="card"><div class="tscroll"><table>
    <tr><th>Metric</th><th>Frequency</th><th>Method</th><th>Target</th></tr>
    ${MEASURE.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}
  </table></div></div>

  <h2 class="sec">Adjustment triggers</h2><div class="card"><div class="tscroll"><table>
    <tr><th>Trigger</th><th>Action</th></tr>
    ${ADJUST.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}
  </table></div></div>
  <div class="rule"><span class="eyebrow">Apply these only against a 7-day rolling average</span><p>Never during a deload week, a diet break week, or the first week after either.</p></div>

  <h2 class="sec">Baseline — Evolt 360, March 7, 2026</h2><div class="card"><div class="tscroll"><table>
    <tr><th>Measure</th><th>Result</th><th>Reference range</th></tr>
    ${BASELINE.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1])}</td><td class="num">${esc(r[2])}</td></tr>`).join("")}
  </table></div></div>

  <h2 class="sec">The two hard stops</h2>
  <div class="rule"><span class="eyebrow">Calorie floor</span><p>Do not drop any day below 1,700 kcal at any point, including deload weeks and Phase 4. Below that, protein at 190 g leaves too little room for the fat floor and the vegetable floor at the same time.</p></div>
  <div class="rule"><span class="eyebrow">Week 30</span><p>Do not extend the deficit past Week 30 without a rescan. If you are not at 10 to 12 percent, run the reverse diet as written, hold at maintenance for 6 to 8 weeks, and start a second, shorter cut.</p></div>
  <p class="footnote">This program is built from bioelectrical impedance data, which is a reference tool rather than a diagnostic one. It is not medical advice. If you notice persistent fatigue, sleep disruption, or loss of training performance that does not resolve after a deload week, stop and speak to a healthcare professional.</p>`;
  return h;
}

    <h2 class="sec">Today's checkmarks</h2>
    <div class="card">
      <p class="body">Checkmarks clear on their own when the calendar date changes. Clear them early if you need to restart the day.</p>
      <div class="field"><button class="btn" data-act="resetChecks">Clear today's checkmarks</button></div>
    </div>

    <h2 class="sec">Backup and restore</h2>
    <div class="card">
      <p class="body">Everything Fit’ed remembers — your training log, weigh-ins, start date, theme, grocery and prep ticks — lives only in this browser. iOS clears that storage if you go about a week without opening the app, and Private Browsing clears it on close. A backup is the only way that data survives.</p>
      ${(function(){ const s=backupStats(collectBackup()); return `<div class="bkstat">
        <div><div class="n">${s.entries}</div><div class="l">Logged entries</div></div>
        <div><div class="n">${s.movements}</div><div class="l">Movements</div></div>
        <div><div class="n">${s.weights}</div><div class="l">Weigh-ins</div></div>
      </div>`; })()}
      <p style="margin-top:8px;font-size:12px;color:var(--muted)">${esc(lastBackupLine())}</p>
      <div class="bkrow">
        <button class="btn gold" data-act="bkFile">Download backup</button>
        <button class="btn" data-act="bkCopy">Copy backup</button>
      </div>
      <textarea class="bkta" id="bkOut" readonly placeholder="Your backup text appears here after you tap Copy."></textarea>
      <div class="bkwarn">Download saves a file to your device. Copy puts the same thing on your clipboard — paste it into Notes or email it to yourself. Either one restores everything.</div>
    </div>

    <h2 class="sec">Restore from a backup</h2>
    <div class="card">
      <p class="body">Paste a backup below, or pick a saved file. Fit’ed will show you what is inside before anything is overwritten.</p>
      <div class="bkrow"><button class="btn" data-act="bkPick">Choose backup file</button></div>
      <input type="file" id="bkFileIn" class="bkfile" accept="application/json,.json,.txt">
      <textarea class="bkta" id="bkIn" placeholder="Paste backup text here" spellcheck="false" autocapitalize="off" autocorrect="off">${esc(PENDING?JSON.stringify(PENDING):"")}</textarea>
      <div class="bkrow">
        <button class="btn" data-act="bkCheck">Check backup</button>
        <button class="btn gold" data-act="bkRestore"${PENDING?"":" disabled style=\"opacity:.45\""}>Restore</button>
      </div>
      <div class="bkmsg" id="bkMsg"></div>
      <div class="bkwarn">Restoring replaces the log, weigh-ins, start date and theme on this device with what is in the backup. Today’s checkmarks are left alone.</div>
    </div>

    <h2 class="sec">Coming to Settings</h2>
    <div class="card">
      <p>Meal variants per slot, notification timing and unit display. Not built yet — this tab is the place they will live.</p>
    </div>
    <p class="footnote">Fit’ed is the session tool. The full reasoning, the phase math, the swap tables and the disclaimer live in the multi-phase nutrition program document.</p>`;
  return h;
}

/* ============================================================
   14. PAINT + EVENTS
   ============================================================ */
const VIEWS = {today:"v-today", train:"v-train", fuel:"v-fuel", progress:"v-progress", settings:"v-settings"};
const RENDER = {today:renderToday, train:renderTrain, fuel:renderFuel, progress:renderProgress, settings:renderSettings};

function paint(scroll){
  Object.entries(VIEWS).forEach(([tab,id])=>$(id).classList.toggle("hidden", tab!==state.tab));
  const el=$(VIEWS[state.tab]);
  el.innerHTML = RENDER[state.tab]();
  el.classList.remove("in"); void el.offsetWidth; el.classList.add("in");
  buildTabs(); paintHeader();
  if(scroll!==false) window.scrollTo({top:0,behavior:"instant"});
}
function go(tab){ state.tab=tab; paint(); }

document.addEventListener("click", e=>{
  const t = sel => e.target.closest(sel);
  let el;

  if((el=t("[data-tab]"))){ 
    const tab=el.dataset.tab;
    if(tab==="fuel"){ state.fuelMeal=null; state.fuelDay=null; state.fuelSub="week"; state.prepHide=false; }
    if(tab==="train"){ state.trainDay=null; }
    go(tab); return;
  }
  if((el=t("[data-ck]"))){ toggleCheck(el.dataset.ck); paint(false); return; }
  if((el=t("[data-hist]"))){ openHist(el.dataset.hist); return; }
  if((el=t("[data-addset]"))){
    const wrap=el.closest(".logwrap");
    const rows=readRows(wrap); rows.push({w:"",r:""});
    writeSets(wrap.getAttribute("data-ex"), rows);
    repaintLog(wrap.getAttribute("data-uid")); return;
  }
  if((el=t("[data-delset]"))){
    const wrap=el.closest(".logwrap");
    const rows=readRows(wrap); rows.splice(Number(el.dataset.delset),1);
    writeSets(wrap.getAttribute("data-ex"), rows.length?rows:[]);
    repaintLog(wrap.getAttribute("data-uid")); return;
  }
  if((el=t("[data-rest]"))){
    const name=el.dataset.rest;
    tStart(name, restFor(name)); return;
  }
  if((el=t("[data-pk]"))){ togglePrepCheck(state.week, el.dataset.pk); paint(false); return; }
  if((el=t("[data-ptab]"))){ state.prepView=el.dataset.ptab; paint(); return; }
  if((el=t("[data-prepweek]"))){
    state.week=Number(el.dataset.prepweek); state.fuelSub="prep"; state.fuelDay=null; state.fuelMeal=null;
    buildWeekSelect(); paint(); return;
  }
  if((el=t("[data-gr]"))){ const g=getJSON(LS.grocery,{}); const k=el.dataset.gr; g[k]=!g[k]; setJSON(LS.grocery,g); paint(false); return; }
  if((el=t("[data-train]"))){ state.trainDay=Number(el.dataset.train); paint(); return; }
  if((el=t("[data-fuelday]"))){ state.fuelDay=Number(el.dataset.fuelday); state.fuelMeal=null; paint(); return; }
  if((el=t("[data-meal]"))){ state.fuelMeal=el.dataset.meal; paint(); return; }
  if((el=t("[data-sub]"))){ state.fuelSub=el.dataset.sub; state.fuelDay=null; state.fuelMeal=null; paint(); return; }
  if((el=t("[data-back]"))){
    const b=el.dataset.back;
    if(b==="trainweek") state.trainDay=null;
    if(b==="fuelweek"){ state.fuelDay=null; state.fuelMeal=null; }
    if(b==="fuelday") state.fuelMeal=null;
    paint(); return;
  }
  if((el=t("[data-go]"))){
    const tab=el.dataset.go, day=Number(el.dataset.day);
    if(tab==="fuelprep"){
      if(el.dataset.week){ state.week=Number(el.dataset.week); buildWeekSelect(); }
      state.fuelSub="prep"; state.fuelDay=null; state.fuelMeal=null; go("fuel"); return;
    }
    if(tab==="train") state.trainDay=day;
    if(tab==="fuel"){ state.fuelSub="week"; state.fuelDay=day; state.fuelMeal=null; }
    go(tab); return;
  }
  if((el=t("[data-scheme]"))){
    const id=el.dataset.scheme;
    set(LS.theme,id); applyTheme(id); paint(false); return;
  }
  if((el=t("[data-act]"))){
    const a=el.dataset.act;
    if(a==="saveStart"){ const v=$("startIn").value; if(v){ set(LS.start,v); state.week=liveWeek(); buildWeekSelect(); paint(); } }
    if(a==="resetStart"){ set(LS.start,DEFAULT_START); state.week=liveWeek(); buildWeekSelect(); paint(); }
    if(a==="resetChecks"){ setJSON(ckKey(),{}); paint(false); }
    if(a==="resetGrocery"){ setJSON(LS.grocery,{}); paint(false); }
    if(a==="bkFile"){ doExport("file"); }
    if(a==="bkCopy"){ doExport("copy"); }
    if(a==="bkPick"){ const f=$("bkFileIn"); if(f) f.click(); }
    if(a==="bkCheck"){ previewImport(); }
    if(a==="bkRestore"){ applyImport(); }
    if(a==="prepReset"){ resetPrepChecks(state.week); paint(false); }
    if(a==="prepHide"){ state.prepHide=!state.prepHide; paint(false); }
    if(a==="saveWeight"){
      const v=parseFloat($("wIn").value);
      if(!isNaN(v)&&v>0){ const w=getJSON(LS.weights,{}); w[isoOf(new Date())]=Math.round(v*10)/10; setJSON(LS.weights,w); }
      paint(false);
    }
    return;
  }
});

document.addEventListener("change", e=>{
  const f=e.target.closest("#bkFileIn"); if(!f || !f.files || !f.files[0]) return;
  const rd=new FileReader();
  rd.onload=()=>{ const ta=$("bkIn"); if(ta){ ta.value=String(rd.result||""); } previewImport(); };
  rd.onerror=()=>bkMsg("err","Could not read that file.");
  rd.readAsText(f.files[0]);
});
document.addEventListener("input", e=>{
  const inp=e.target.closest("[data-set]"); if(!inp) return;
  const wrap=inp.closest(".logwrap"); if(!wrap) return;
  inp.classList.toggle("filled", inp.value.trim()!=="");
  writeSets(wrap.getAttribute("data-ex"), readRows(wrap));
});
(function(){
  let pt=null;
  document.addEventListener("touchstart", e=>{
    const b=e.target.closest("[data-rest]"); if(!b) return;
    pt=setTimeout(()=>{ askRest(b.dataset.rest, b); pt=null; }, 550);
  }, {passive:true});
  document.addEventListener("touchend", ()=>{ if(pt){clearTimeout(pt);pt=null;} }, {passive:true});
  document.addEventListener("touchmove", ()=>{ if(pt){clearTimeout(pt);pt=null;} }, {passive:true});
  document.addEventListener("contextmenu", e=>{
    const b=e.target.closest("[data-rest]"); if(!b) return;
    e.preventDefault(); askRest(b.dataset.rest, b);
  });
})();
function askRest(name, btn){
  const cur=restFor(name);
  const v=prompt("Rest for "+name+" — seconds:", String(cur));
  if(v===null) return;
  const n=Math.max(5, Math.min(900, parseInt(v,10)||cur));
  setRest(name,n);
  if(btn) btn.textContent="Rest "+fmtClock(n);
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeHist(); });
document.addEventListener("click", e=>{
  const w=$("hwrap"); if(w && e.target===w) closeHist();
});
$("wkSel").addEventListener("change", e=>{
  state.week = Number(e.target.value);
  state.trainDay=null; state.fuelDay=null; state.fuelMeal=null;
  paint();
});
$("liveBtn").addEventListener("click", ()=>{
  state.week = liveWeek();
  state.trainDay=null; state.fuelDay=null; state.fuelMeal=null;
  buildWeekSelect(); paint();
});

/* ---------- theme ---------- */
function applyTheme(id){
  document.documentElement.dataset.theme=id;
  const bg=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta&&bg) meta.setAttribute("content",bg);
}

/* ---------- date rollover ---------- */
function checkDateRollover(){
  const stored=get(LS.date,null), today=isoOf(new Date());
  if(stored!==today){
    set(LS.date,today); purgeChecks();
    const lw=liveWeek();
    if(state.week!==lw){ state.week=lw; buildWeekSelect(); }
    paint(false);
  }
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkDateRollover(); });
window.addEventListener("focus", checkDateRollover);
setInterval(checkDateRollover, 60000);

/* ---------- init ---------- */
applyTheme(get(LS.theme,"midnight"));
set(LS.date, isoOf(new Date()));
purgeChecks();
state.week = liveWeek();
buildWeekSelect();
paint();
</script>

    <div class="hscroll" id="hbody"></div>
